<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bad Apple!! - Shadow Art</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #enter-btn {
            background: transparent;
            color: #fff;
            border: 2px solid #fff;
            border-radius: 12px;
            padding: 15px 40px;
            font-size: 24px;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 100;
            position: absolute;
        }

        #enter-btn:hover {
            background: #fff;
            color: #000;
        }

        #video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: none;
            z-index: 10;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <div id="video-container">
        <video id="bad-apple-video" autoplay loop>
            <source src="badapple.mp4" type="video/mp4">
        </video>
    </div>

    <button id="enter-btn">进入</button>

    <script>
        const enterBtn = document.getElementById('enter-btn');
        const videoContainer = document.getElementById('video-container');
        const video = document.getElementById('bad-apple-video');

        enterBtn.addEventListener('click', function() {
            const btn = this;

            // 显示视频（居中由 CSS 控制）
            videoContainer.style.display = 'block';

            // 播放本地视频（带声音）
            video.muted = false;
            video.play().catch(e => console.log('Autoplay blocked:', e));

            // 按钮缓缓消失（淡出后移除）
            btn.style.transition = 'opacity 0.8s ease';
            btn.style.opacity = '0';
            setTimeout(function() {
                btn.style.display = 'none';
            }, 800);
        });
    </script>
</body>
</html>
