<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bad Apple!! - Shadow Art</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #enter-btn {
            background: transparent;
            color: #fff;
            border: 2px solid #fff;
            border-radius: 12px;
            padding: 15px 40px;
            font-size: 24px;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 100;
            position: absolute;
            opacity: 1;
        }

        #enter-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: auto;
        }

        #enter-btn:hover {
            background: #fff;
            color: #000;
        }

        #video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: none;
            z-index: 10;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <div id="video-container">
        <video id="bad-apple-video" loop preload="auto">
            <source src="badapple.mp4" type="video/mp4">
        </video>
    </div>

    <button id="enter-btn" disabled>加载中…</button>

    <script>
        const enterBtn = document.getElementById('enter-btn');
        const videoContainer = document.getElementById('video-container');
        const video = document.getElementById('bad-apple-video');

        // 预加载整个视频
        video.preload = 'auto';

        // 视频完整加载(可流畅播放到末尾)后才启用进入按钮
        video.addEventListener('canplaythrough', function() {
            enterBtn.disabled = false;
            enterBtn.textContent = '进入';
        });
        video.addEventListener('canplay', function() {
            // 备用：progress 已足够时也启用
        });
        video.addEventListener('error', function() {
            enterBtn.textContent = '视频加载失败';
        });

        // 兜底逻辑：progress 显示已缓冲到末尾就启用
        function checkBuffered() {
            if (enterBtn.disabled && video.buffered.length > 0) {
                const bufferedEnd = video.buffered.end(video.buffered.length - 1);
                if (bufferedEnd >= video.duration) {
                    enterBtn.disabled = false;
                    enterBtn.textContent = '进入';
                }
            }
        }
        video.addEventListener('progress', checkBuffered);

        enterBtn.addEventListener('click', function() {
            if (enterBtn.disabled) return;
            const btn = this;

            // 显示视频（居中由 CSS 控制）
            videoContainer.style.display = 'block';
            videoContainer.style.opacity = '0';
            requestAnimationFrame(function() {
                videoContainer.style.transition = 'opacity 0.5s ease';
                videoContainer.style.opacity = '1';
            });

            // 播放本地视频（带声音）
            video.muted = false;
            video.play().catch(e => console.log('Autoplay blocked:', e));

            // 按钮缓缓消失（淡出后移除）
            btn.style.transition = 'opacity 0.8s ease';
            btn.style.opacity = '0';
            setTimeout(function() {
                btn.style.display = 'none';
            }, 800);
        });

        // 页面加载后开始预加载
        video.load();
    </script>
</body>
</html>
